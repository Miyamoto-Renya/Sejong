# 같은 stage 비율·head 폭을 유지하며 본체 폭을 2배 확장한 측정 설정.
[model]
id = "sejong"
width = 1024
layers = 8
heads = 16
kv_heads = 8
ffn_width = 3072
context = 2048
precision = "f16"
seed = 42

[model.hierarchy]
patch_size = 8
encoder_width = 256
encoder_layers = 2
encoder_heads = 4
encoder_ffn_width = 768
decoder_width = 256
decoder_layers = 2
decoder_heads = 4
decoder_ffn_width = 768
local_window = 128
checkpoint_encoder = false
checkpoint_decoder = false

[model.experts]
count = 4
top_k = 2
ffn_width = 768

[training]
gradient_diagnostics_every = 32
optimizer = "control_variate_sgd"
clip_enabled = false
activation_checkpointing = true
steps = 10000
sequence = 512
batch = 1
accumulation = 8
learning_rate = 0.0003
min_learning_rate = 0.00003
warmup_steps = 100
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.0
clip_norm = 1.0
loss_scale = 1.0
checkpoint_every = 500
log_every = 10
seed = 123

[training.control_variate]
controls = 2
rank = 32
sampling = "stratified"
strata = 2
basis_refresh = 32
predictor_learning_rate = 0.001

[gpu]
device = 0
architecture = "gfx1032"
wavefront = 32
memory_mb = 0

