# 같은 stage 비율·head 폭을 유지하며 본체 폭을 2배 확장한 측정 설정.
[model]
id = "sejong"
width = 1024
layers = 8
heads = 16
ffn_width = 3072
context = 2048
precision = "f16"
seed = 42

[training]
gradient_diagnostics_every = 0
optimizer = "sgd"
clip_enabled = false
activation_checkpointing = true
steps = 10000
sequence = 512
batch = 1
accumulation = 8
learning_rate = 0.0003
min_learning_rate = 0.00003
warmup_steps = 100
beta1 = 0.9
beta2 = 0.95
weight_decay = 0.0
clip_norm = 1.0
loss_scale = 1.0
checkpoint_every = 500
log_every = 10
seed = 123

[gpu]
device = 0
architecture = "gfx1032"
wavefront = 32
memory_mb = 0

